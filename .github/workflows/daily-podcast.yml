name: Taeglicher Podcast

on:
  schedule:
    # 04:20 UTC - kurz nach dem taeglichen Sammellauf (04:00 UTC), damit
    # der Podcast garantiert auf den frischesten Tageseintraegen basiert.
    - cron: "20 4 * * *"
  workflow_dispatch: # erlaubt manuelles Ausloesen zum Testen
    inputs:
      test_modus:
        description: "Testlauf: nicht in den Kanal senden, MP3 als Download"
        type: boolean
        default: false
      test_chat_id:
        description: "Optional: private Telegram-Chat-ID fuer den Testversand"
        type: string
        required: false

jobs:
  generate-podcast:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Podcast generieren und verschicken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_CREDENTIALS: ${{ secrets.GOOGLE_TTS_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODUS: ${{ inputs.test_modus }}
        run: python src/daily_podcast.py

      - name: Test-Podcast als Download bereitstellen
        if: ${{ inputs.test_modus }}
        uses: actions/upload-artifact@v7
        with:
          name: podcast-test
          path: |
            podcast_test.mp3
            podcast_test.txt
