# Prioritätsquellen für den KI-News-Agenten
#
# rss_quellen: werden bei jedem Lauf per RSS abgeklappert (kostenlos, kein Rate-Limit)
# Hinweis: Anthropic und Meta AI haben (Stand 2026) keinen offiziellen RSS-Feed.
# Sie werden stattdessen über die ergänzende Google-Suche unten mit abgedeckt.
rss_quellen:
  - name: "OpenAI"
    url: "https://openai.com/news/rss.xml"
  - name: "Google DeepMind"
    url: "https://deepmind.google/blog/feed/basic/"
  - name: "Heise Künstliche Intelligenz"
    url: "https://www.heise.de/thema/Kuenstliche-Intelligenz.xml"
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
  - name: "Ars Technica AI"
    url: "https://arstechnica.com/ai/feed/"

# Ergänzende Suche über Anthropics Web-Search-Tool (Teil der Claude-API,
# ca. 10$ pro 1000 Suchen – bei dieser Anzahl Anfragen vernachlässigbar).
# Deckt vor allem Anthropic und Meta AI ab, die keinen eigenen RSS-Feed haben,
# und fängt generell ab, was die Prioritätsliste verpasst.
# (Ursprünglich war hier die Google Custom Search API vorgesehen – die nimmt
# seit 2025 aber keine neuen Kunden mehr an, siehe Kommentar in sources.py)
suchanfragen:
  - "Anthropic Claude announcement"
  - "Meta AI model release"
  - "new AI model release"
  - "KI Regulierung Gesetz"
